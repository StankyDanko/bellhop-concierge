# Bellhop Concierge tool server (added 2026-10-15). NEW site block on a NEW hostname;
# no existing conf is modified. Caddy reaches the container by name on localai_default.
# Allowlist only: /health and /tools/*. Tool routes authenticate in-app (X-Concierge-Secret).
concierge.southernsky.cloud {
    encode zstd gzip

    handle /health {
        reverse_proxy bellhop-concierge:4040
    }

    handle /tools/* {
        reverse_proxy bellhop-concierge:4040
    }

    handle {
        respond "not found" 404
    }
}
