# Bellhop Concierge: tool server + dashboard. NEW site block on a NEW hostname;
# no existing conf is modified. Caddy reaches the container by name on localai_default.
# Everything proxies to the app: /health and /tools/* (tool routes authenticate in-app via
# X-Concierge-Secret), /api/* (writes need X-Admin-Token), and the dashboard (/, /build,
# /property/*, /assets/*). The app itself 404s unknown paths.
concierge.southernsky.cloud {
    encode zstd gzip

    reverse_proxy bellhop-concierge:4040
}
